name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      CHANNEL_HMAC_SECRET: ci-hmac-secret
      CHANNEL_SEND_URL: http://channel/send
      GROQ_API_KEY: ci-groq-key
      OPENROUTER_API_KEY: ci-openrouter-key
      SUPABASE_JWT_SECRET: ci-jwt-secret-ci-jwt-secret-0001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Alembic migrate
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
